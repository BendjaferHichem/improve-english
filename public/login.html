<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Outloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth">
<a class="logo" href="/">Outloud</a>
<main>
  <h1 id="title">Welcome back</h1>

  <button class="btn btn--block btn--google" id="googleBtn" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continue with Google
  </button>
  <p class="divider"><span>or use email</span></p>

  <form id="authForm" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    <p class="alert alert--error" id="authError" role="alert" hidden></p>
    <p class="alert alert--info" id="authInfo" role="status" hidden></p>
    <button class="btn btn--primary btn--block" id="submitBtn" type="submit">Sign in</button>
    <button class="link" id="forgotBtn" type="button">Forgot password?</button>
  </form>
  <p class="switch"><span id="switchText">New here?</span> <button class="link" id="switchBtn" type="button">Create an account</button></p>
    <p class="switch" style="margin-top:.5rem"><a href="/conversation?guest=1">Or continue as a guest</a></p>
</main>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
